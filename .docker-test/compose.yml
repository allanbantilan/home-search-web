services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: testpassword
      MARIADB_ROOT_PASSWORD: testrootpassword
    volumes:
      - db_data:/var/lib/mysql
  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: testpassword
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "127.0.0.1:${HOME_SEARCH_PORT:-57106}:80"
    volumes:
      - wp_data:/var/www/html
      - ../property-search:/var/www/html/wp-content/themes/property-search:ro
      - ../estate-search:/var/www/html/wp-content/plugins/estate-search:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  cli:
    image: wordpress:cli-php8.2
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: testpassword
      WORDPRESS_DB_NAME: wordpress
    profiles: [tools]
    depends_on:
      - db
      - wordpress
    volumes:
      - wp_data:/var/www/html
      - ../property-search:/var/www/html/wp-content/themes/property-search:ro
      - ../estate-search:/var/www/html/wp-content/plugins/estate-search:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./:/home-search-test:ro

volumes:
  db_data:
  wp_data:
